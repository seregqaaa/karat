# Шринк kotlin-stdlib до реально используемого: без него dex ~2.7 МБ.
# Только удаление недостижимого кода — без оптимизации и обфускации, чтобы
# байткод в APK можно было прогнать теми же JVM-тестами, что и до шринка.
-libraryjars <android_jar>
-dontoptimize
-dontobfuscate
# preverify оставлен включённым: StackMapTable нужен JVM, чтобы прогнать
# шринкнутый байткод тестами (dx их всё равно отбрасывает — на dex не влияет)
-dontnote
-dontwarn **

# Точка входа — активити из манифеста; всё остальное подтягивается по ссылкам.
-keep public class ru.karat.k20viewer.MainActivity {
    public <init>(...);
    public *;
    protected *;
}
# Стандартные точки входа Android (на будущее — вьюхи/сервисы из XML).
-keep public class * extends android.app.Activity
-keepclassmembers class * extends android.app.Activity {
    public void *(android.view.View);
}
