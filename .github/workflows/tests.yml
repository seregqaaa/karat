# Прогон тестов парсера на каждом пуше. Реальных архивов в CI нет —
# выполняются синтетические сьюты и сверка округления с python.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.mjs
